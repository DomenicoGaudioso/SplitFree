name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test e typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  android:
    name: APK Android
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Genera progetto nativo
        run: npx expo prebuild --platform android --no-install
      - name: Compila APK (firma debug, installabile)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SplitFree-android-apk
          path: android/app/build/outputs/apk/release/*.apk

  macos:
    name: App macOS
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run export:web
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: SplitFree-macos
          path: |
            desktop/out/*.dmg
            desktop/out/*.zip

  release:
    name: Release su GitHub
    runs-on: ubuntu-latest
    needs: [android, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Rinomina i file con la versione
        run: |
          set -e
          VER="${GITHUB_REF_NAME}"
          mkdir -p out
          cp artifacts/SplitFree-android-apk/*.apk "out/SplitFree-${VER}-android.apk"
          for f in artifacts/SplitFree-macos/*.dmg; do cp "$f" "out/SplitFree-${VER}-macos.dmg"; done
          for f in artifacts/SplitFree-macos/*.zip; do cp "$f" "out/SplitFree-${VER}-macos.zip"; done
          ls -la out
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/*             --repo "${GITHUB_REPOSITORY}"             --title "SplitFree ${GITHUB_REF_NAME}"             --notes "APK Android (firma debug, installabile abilitando le origini sconosciute) e app macOS (non firmata: primo avvio con tasto destro, Apri)."             || gh release upload "${GITHUB_REF_NAME}" out/* --repo "${GITHUB_REPOSITORY}" --clobber
